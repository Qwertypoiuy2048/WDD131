<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="recipes.css">
    <script src="recipes.js" defer></script>
    <meta name="author" content="Evan Crenshaw">
    <meta name="description" content="W09 prove practicing Flexbox">
    <title>recipes</title>

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Recipe Book">
    <meta property="og:description" content="For all your recipe needs">
    <meta property="og:url" content="https://qwertypoiuy2048.github.io/WDD131/W09/recipes.html">
    <meta property="og:image" content="https://wddbyui.github.io/wdd131/images/recipe1/apple-crisp.jpg">

    <!-- X Card -->
    <meta name="twitter:card" content="Social Preview Image">
    <meta name="twitter:title" content="Recipe Book">
    <meta name="twitter:description" content="For all your recipe needs">
    <meta name="twitter:image" content="https://wddbyui.github.io/wdd131/images/recipe1/apple-crisp.jpg">

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="https://wddbyui.github.io/wdd131/images/recipe1/recipe-book.png">

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
</head>

<body>
    <header>
        <img src="https://wddbyui.github.io/wdd131/images/recipe1/recipe-book.png" alt="Recipe Book Logo">
        <h1>Recipe Book</h1>
        <form action="submit">
            <input type="search" placeholder="Find a Recipe"></input>
            <input type="submit">
                <img src="https://wddbyui.github.io/wdd131/images/recipe1/search.svg" alt="Search" class="search">
            </input>
        </form>
    </header>
    <hr>
    <section class="recipe">
        <img src="https://wddbyui.github.io/wdd131/images/recipe1/apple-crisp.jpg" alt="Apple Crisp">
        <div class="tags">
            <div class="tag">
                <p>dessert</p>
            </div>
        </div>
        <h3 class="name">Apple Crisp</h3>
        <span class="rating" role="img" aria-label="Rating: 4 out of 5 stars">
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star-empty">☆</span>
        </span>
    </section>
    <footer>
        <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik -
            Flaticon</a>
        <div class="social">
            <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
            <a href="#"><img src="https://wddbyui.github.io/wdd131/images/recipe1/instagram_icon.svg"
                    alt="instagram icon"></a>
            <a href="#"><img src="https://wddbyui.github.io/wdd131/images/recipe1/youtube_icon.svg"
                    alt="youtube icon"></a>
            <a href="#"><img src="https://wddbyui.github.io/wdd131/images/recipe1/pinterest_icon.svg"
                    alt="pinterest icon"></a>
        </div>
    </footer>
</body>

</html>
